name: Dependabot auto-merge
# CI-gated: waits for every other Actions workflow on the PR's head SHA to finish
# green, then squash-merges patch + minor dependabot PRs. Major updates stay manual.
#
# Why the wait exists: these repos have no branch protection, so `gh pr merge --auto`
# merges immediately instead of waiting for checks. That is how a dependabot lockfile
# that drops the pnpm `overrides:` block reached main and broke production builds.
#
# Runs on pull_request, not pull_request_target (blocked by default in public repos
# from 2026-12-02). Dependabot pull_request runs honor the job-level permissions below.
# Gated on the PR author plus a same-repo head; no PR code is checked out or executed.
on: pull_request

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI, then merge (patch + minor only)
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.workflow }}
        run: |
          set -uo pipefail
          echo "Waiting for workflow runs on $SHA (excluding \"$SELF\") ..."
          for _ in $(seq 1 90); do
            runs=$(gh run list --repo "$REPO" --commit "$SHA" --limit 100 \
                     --json workflowName,status,conclusion \
                     --jq '.[] | [.workflowName, .status, (.conclusion // "")] | @tsv' 2>/dev/null)
            other=$(printf '%s\n' "$runs" | grep -v "^${SELF}$(printf '\t')" | sed '/^$/d')

            if [ -z "$other" ]; then
              sleep 20
              continue
            fi
            if printf '%s\n' "$other" | awk -F'\t' '$2 != "completed" { found = 1 } END { exit !found }'; then
              sleep 20
              continue
            fi
            if printf '%s\n' "$other" | awk -F'\t' '$3 != "success" && $3 != "skipped" && $3 != "neutral" { found = 1 } END { exit !found }'; then
              echo "CI not green -> leaving PR open for review:"
              printf '%s\n' "$other"
              exit 0
            fi
            echo "CI green -> merging"
            gh pr merge --squash --delete-branch "$PR_URL"
            exit 0
          done
          echo "Timed out waiting for CI (30 min); leaving PR open."
