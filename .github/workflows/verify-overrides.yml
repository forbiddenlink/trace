name: Verify pnpm overrides

# Every transitive-CVE fix in this repo is a pnpm.overrides entry, and those can stop
# working with no visible signal - a lockfile regenerated by the wrong pnpm drops the
# overrides block wholesale (renovatebot/renovate#43161). A green build on a stripped
# override block is worse than a red one: the repo looks patched and is not.
#
# Runs on PRs and pushes that touch dependency files, plus weekly to catch drift from
# automerged dependency PRs that nobody reviewed.

on:
  pull_request:
    paths:
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/pnpm-workspace.yaml'
  push:
    branches: [main, master]
    paths:
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/pnpm-workspace.yaml'
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-overrides:
    name: Overrides still in force
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # No pnpm install needed: the check reads package.json and pnpm-lock.yaml as text,
      # so it cannot be affected by the very install it is policing.
      - name: Verify every declared override is in force
        run: bash .github/scripts/verify-overrides.sh .
